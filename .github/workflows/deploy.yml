# Gera o site e publica na branch gh-pages a cada push na main.
# Endereço: https://guilhermeoliveirabrito.github.io/stadium-tickets-3d/
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # o token do workflow não fica gravado na cópia do repositório
          # (assim nenhum pacote instalado consegue lê-lo)
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # sem scripts de instalação: nenhum pacote roda código ao ser instalado
      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Publicar a pasta dist na branch gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
